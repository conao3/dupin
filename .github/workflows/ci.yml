name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # cache-nix-action purges superseded caches.
  actions: write

jobs:
  check:
    # Apple silicon (M4); Dupin targets nothing else. Labels: docs.blacksmith.sh, "Instance Types".
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Blacksmith serves actions/cache-based caches from its own colocated store.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-macos: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never

      # clippy, tests (debug, as cargo runs them), rustfmt, and the release app bundle
      # (`packages.dupin` is one of the checks).
      - run: nix flake check
