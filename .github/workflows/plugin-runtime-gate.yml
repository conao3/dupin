name: Plugin runtime measurements

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/plugin-runtime-gate.yml'
      - 'experiments/wasm-app-startup/**'
      - 'crates/**'
      - 'plugins/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'flake.lock'
      - 'flake.nix'
      - 'package.nix'
      - 'nix/packages.nix'
      - 'nix/calculator-plugin.nix'
      - 'scripts/unlink-store.nu'

permissions:
  contents: read
  actions: read

concurrency:
  group: plugin-runtime-measurements-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-and-idle-memory:
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - name: Build both variants from the same source
        run: |
          nix build .#dupin-no-wasm --out-link "$RUNNER_TEMP/native-app"
          nix build .#dupin --out-link "$RUNNER_TEMP/wasm-app"
      - name: Install the measurement interpreter
        run: nix profile install --inputs-from . nixpkgs#nushell
      - name: Measure hidden native startup and idle process memory
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          nu experiments/wasm-app-startup/tests.nu
          nu experiments/wasm-app-startup/measure.nu \
            "$RUNNER_TEMP/native-app/Applications/Dupin.app" "$RUNNER_TEMP/wasm-app/Applications/Dupin.app" \
            --pairs 3 --output "$RUNNER_TEMP/plugin-runtime-measurements"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: plugin-runtime-startup-and-idle-memory
          path: ${{ runner.temp }}/plugin-runtime-measurements
          if-no-files-found: warn
