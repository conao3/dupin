name: tagpr

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency: tagpr

permissions: {}

jobs:
  tagpr:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'tagpr-from-')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
      pull_request: ${{ steps.tagpr.outputs.pull_request }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: tagpr
        uses: Songmu/tagpr@047aec4b6c0ce166f52958b5a97f5a3d927fd65b # v1.22.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A pull request pushed with GITHUB_TOKEN starts no workflows, so run CI on the release
  # branch explicitly.
  ci:
    needs: tagpr
    if: needs.tagpr.outputs.tag == '' && needs.tagpr.outputs.pull_request != ''
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ fromJSON(needs.tagpr.outputs.pull_request).head.ref }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
