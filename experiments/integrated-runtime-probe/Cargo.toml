[package]
name = "dupin-integrated-runtime-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[dependencies]
dupin-plugin-protocol = { path = "../../crates/dupin-plugin-protocol" }
